<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饮酒监控器</title>
  <style>
    :root {
      --lacquer: #24110d;
      --lacquer-2: #401b15;
      --vermilion: #9f2f1e;
      --vermilion-deep: #6f1d16;
      --jade: #1f5a4b;
      --jade-deep: #133b35;
      --paper: #f7e8bf;
      --paper-strong: #fff4cf;
      --paper-dim: #ecd59a;
      --ink: #2a1710;
      --muted: #795f43;
      --soft: #a98b5a;
      --gold: #d6a741;
      --gold-deep: #9f6d1e;
      --warn: #cf8a25;
      --danger: #b33827;
      --line: rgba(70, 35, 18, 0.25);
      --shadow: 0 22px 0 rgba(36, 17, 13, 0.1), 0 34px 68px rgba(36, 17, 13, 0.34);
      --radius-xl: 8px;
      --radius-lg: 6px;
      --radius-md: 4px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(214, 167, 65, 0.2), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(159, 47, 30, 0.22), transparent 25%),
        linear-gradient(135deg, rgba(255, 244, 207, 0.72) 0 12%, transparent 12% 24%, rgba(255, 244, 207, 0.42) 24% 36%, transparent 36% 48%),
        linear-gradient(180deg, #341712 0%, #532018 42%, #26120f 100%);
      background-size: auto, auto, 42px 42px, auto;
      padding: 22px 18px 38px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 30%, rgba(247, 232, 191, 0.16) 0 1px, transparent 1px),
        radial-gradient(circle at 75% 70%, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px),
        linear-gradient(rgba(255, 244, 207, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 244, 207, 0.04) 1px, transparent 1px);
      background-size: 9px 9px, 13px 13px, 36px 36px, 36px 36px;
      mix-blend-mode: screen;
      opacity: 0.72;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent 94%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 12px;
      border: 1px solid rgba(214, 167, 65, 0.36);
      box-shadow: inset 0 0 0 3px rgba(36, 17, 13, 0.32);
      pointer-events: none;
    }

    .container {
      max-width: 1260px;
      margin: 0 auto;
      position: relative;
    }

    .showa-hero {
      position: relative;
      max-width: 520px;
      margin-bottom: 16px;
      padding: 14px 16px;
      color: var(--paper-strong);
      background:
        linear-gradient(90deg, rgba(214, 167, 65, 0.18), transparent 12%, transparent 88%, rgba(214, 167, 65, 0.18)),
        linear-gradient(135deg, var(--vermilion-deep), var(--lacquer) 50%, var(--jade-deep));
      border: 1px solid rgba(214, 167, 65, 0.72);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .showa-hero::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 244, 207, 0.42);
      pointer-events: none;
    }

    .showa-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent 0 18px, rgba(255, 244, 207, 0.07) 18px 19px),
        radial-gradient(circle at 85% 50%, rgba(214, 167, 65, 0.18), transparent 30%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .hero-seal {
      width: 68px;
      aspect-ratio: 1;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      background:
        radial-gradient(circle, rgba(111, 29, 22, 0.96) 0 52%, rgba(36, 17, 13, 0.96) 53% 100%);
      box-shadow: inset 0 0 0 6px rgba(214, 167, 65, 0.12);
      font-family: "Iowan Old Style", "Songti SC", serif;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .hero-copy {
      min-width: 0;
    }

    .hero-copy h1 {
      font-size: 2.35rem;
      line-height: 1.05;
      color: var(--paper-strong);
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.32), 0 0 18px rgba(214, 167, 65, 0.24);
    }

    .summary-card,
    .form-card,
    .history-card {
      background:
        linear-gradient(135deg, rgba(214, 167, 65, 0.18), transparent 36%),
        repeating-linear-gradient(90deg, rgba(255, 244, 207, 0.035) 0 12px, transparent 12px 24px),
        var(--lacquer);
      border: 1px solid rgba(214, 167, 65, 0.76);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      color: var(--paper-strong);
    }

    .summary-card::before,
    .form-card::before,
    .history-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(159, 47, 30, 0.11), transparent 18%, transparent 82%, rgba(31, 90, 75, 0.1)),
        radial-gradient(circle at 100% 0%, rgba(214, 167, 65, 0.14), transparent 34%);
      pointer-events: none;
    }

    .summary-card::after,
    .form-card::after,
    .history-card::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(255, 244, 207, 0.16);
      pointer-events: none;
    }

    h1,
    h2,
    h3 {
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", serif;
      letter-spacing: 0;
    }

    .top-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
      gap: 20px;
      align-items: start;
      margin-bottom: 20px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .summary-card:first-child {
      grid-column: 1 / -1;
    }

    .summary-card .stat-label,
    .summary-card .progress-header span:first-child,
    .summary-card .progress-labels,
    .form-group label {
      color: var(--paper-dim);
    }

    .summary-card .section-head h2,
    .summary-card .stat-value,
    .form-card .section-head h2,
    .history-card .section-head h2 {
      color: var(--gold);
    }

    .summary-card {
      padding: 16px;
    }

    .section-head {
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
    }

    .section-head h2,
    .section-head h3 {
      margin-top: 0;
    }

    .section-head h2 {
      font-size: 1.34rem;
      line-height: 1.15;
    }

    .section-head h3 {
      font-size: 1.18rem;
    }

    .stats-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-item {
      min-height: 74px;
      padding: 11px 12px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(214, 167, 65, 0.45);
      background: rgba(247, 232, 191, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-value {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      display: block;
      color: var(--paper-dim);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .progress-section {
      position: relative;
      z-index: 1;
      margin-top: 12px;
    }

    .progress-header,
    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }

    .progress-header {
      margin-bottom: 7px;
      font-size: 0.78rem;
    }

    .progress-header span:first-child {
      color: var(--paper-dim);
    }

    .progress-bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(247, 232, 191, 0.1);
      border: 1px solid rgba(214, 167, 65, 0.24);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--jade) 0%, var(--gold) 100%);
      box-shadow: 0 0 18px rgba(214, 167, 65, 0.32);
      transition: width 0.3s ease, background 0.3s ease;
    }

    .progress-fill.warning {
      background: linear-gradient(90deg, #d19944 0%, #e1b36c 100%);
    }

    .progress-fill.danger {
      background: linear-gradient(90deg, #bf5a43 0%, #d98462 100%);
    }

    .progress-labels {
      margin-top: 6px;
      font-size: 0.64rem;
      color: var(--paper-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .warning {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-size: 0.78rem;
    }

    .warning.normal {
      background: rgba(31, 90, 75, 0.28);
      border-color: rgba(236, 213, 154, 0.16);
      color: var(--paper-strong);
    }

    .warning.caution {
      background: rgba(209, 153, 68, 0.18);
      border-color: rgba(209, 153, 68, 0.28);
      color: var(--paper-strong);
    }

    .warning.danger {
      background: rgba(191, 90, 67, 0.2);
      border-color: rgba(191, 90, 67, 0.32);
      color: var(--paper-strong);
    }

    .form-card {
      padding: 20px;
      position: sticky;
      top: 18px;
    }

    #drinkForm {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(214, 167, 65, 0.34);
      background: rgba(255, 244, 207, 0.9);
      color: var(--ink);
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      appearance: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: rgba(159, 47, 30, 0.55);
      box-shadow: 0 0 0 4px rgba(214, 167, 65, 0.16);
    }

    .form-group input::placeholder {
      color: #aa998a;
    }

    .volume-row {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 10px;
    }

    .btn-submit {
      margin-top: 4px;
      height: 50px;
      border: none;
      border-radius: var(--radius-md);
      background:
        linear-gradient(180deg, rgba(255, 244, 207, 0.18), transparent),
        linear-gradient(135deg, var(--vermilion) 0%, var(--lacquer) 100%);
      color: var(--paper-strong);
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--gold-deep), 0 18px 28px rgba(36, 17, 13, 0.26);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
      box-shadow: 0 10px 0 var(--gold-deep), 0 22px 34px rgba(36, 17, 13, 0.3);
    }

    .history-card {
      padding: 20px;
    }

    .history-headline {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin-bottom: 12px;
    }

    .history-list {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 8px 10px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(214, 167, 65, 0.26);
      background:
        linear-gradient(90deg, rgba(214, 167, 65, 0.13), transparent 36%),
        rgba(247, 232, 191, 0.07);
    }

    .history-info {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .history-brand {
      color: var(--paper-strong);
      font-size: 0.88rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-details {
      color: var(--paper-dim);
      font-size: 0.72rem;
      line-height: 1.32;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-date {
      color: var(--gold);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-delete {
      min-width: 72px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(191, 90, 67, 0.36);
      border-radius: var(--radius-md);
      background: rgba(191, 90, 67, 0.18);
      color: var(--paper-strong);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-delete:hover {
      transform: translateY(-1px);
      background: rgba(191, 90, 67, 0.28);
    }

    .btn-repeat {
      min-width: 108px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid rgba(214, 167, 65, 0.34);
      border-radius: var(--radius-md);
      background: rgba(31, 90, 75, 0.26);
      color: var(--paper-strong);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-repeat:hover {
      transform: translateY(-1px);
      background: rgba(31, 90, 75, 0.36);
    }

    .empty-message {
      display: grid;
      place-items: center;
      min-height: 120px;
      border: 1px dashed rgba(214, 167, 65, 0.28);
      border-radius: var(--radius-lg);
      color: var(--paper-dim);
      text-align: center;
      padding: 24px;
      grid-column: 1 / -1;
    }

    code {
      padding: 0.1em 0.45em;
      border-radius: 999px;
      background: rgba(159, 47, 30, 0.08);
      color: var(--vermilion);
      font-family: "SFMono-Regular", "Menlo", monospace;
      font-size: 0.92em;
    }

    @media (max-width: 1024px) {
      .top-layout {
        grid-template-columns: 1fr;
      }

      .form-card {
        position: static;
      }

      .history-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 16px 12px 28px;
      }

      .summary-card,
      .form-card,
      .history-card {
        padding: 16px;
        border-radius: var(--radius-xl);
      }

      .showa-hero {
        max-width: none;
        padding: 16px;
      }

      .hero-inner {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .hero-seal {
        width: 56px;
      }

      .hero-copy h1 {
        font-size: 1.85rem;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-item {
        min-height: 66px;
        padding: 10px;
      }

      .stat-value {
        font-size: 1.65rem;
      }

      .stat-label {
        font-size: 0.62rem;
      }

      .volume-row {
        grid-template-columns: 1fr;
      }

      .history-headline {
        flex-direction: column;
        align-items: start;
      }

      .history-item {
        gap: 8px;
        padding: 8px 10px;
      }

      .history-actions {
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="showa-hero">
      <div class="hero-inner">
        <div class="hero-seal">酒</div>
        <div class="hero-copy">
          <h1>饮酒监控器</h1>
        </div>
      </div>
    </header>

    <section class="top-layout">
      <div class="summary-grid">
        <section class="summary-card">
          <div class="section-head">
            <h2>本周统计</h2>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="pureAlcohol">0</span>
              <span class="stat-label">纯酒精 (ml)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="alcoholUnits">0</span>
              <span class="stat-label">酒精单位</span>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-header">
              <span>本周进度</span>
              <span id="progressText">0 / 14 单位</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-labels">
              <span>0</span>
              <span>14 单位</span>
            </div>
          </div>
          <div class="warning" id="warning" style="display:none;">
            <span>⚠️</span>
            <span id="warningText"></span>
          </div>
        </section>

        <section class="summary-card">
          <div class="section-head">
            <h2>今日统计</h2>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="dailyPureAlcohol">0</span>
              <span class="stat-label">纯酒精 (ml)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="dailyUnits">0</span>
              <span class="stat-label">酒精单位</span>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-header">
              <span>今日进度</span>
              <span id="dailyProgressText">0 / 4.5 单位</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="dailyProgressFill"></div>
            </div>
            <div class="progress-labels">
              <span>0</span>
              <span>4.5 单位</span>
            </div>
          </div>
          <div class="warning" id="dailyWarning" style="display:none;">
            <span>⚠️</span>
            <span id="dailyWarningText"></span>
          </div>
        </section>

        <section class="summary-card">
          <div class="section-head">
            <h2>近三日统计</h2>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value" id="threeDayPureAlcohol">0</span>
              <span class="stat-label">纯酒精 (ml)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="threeDayUnits">0</span>
              <span class="stat-label">酒精单位</span>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-header">
              <span>近三日进度</span>
              <span id="threeDayProgressText">0 / 13.5 单位</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="threeDayProgressFill"></div>
            </div>
            <div class="progress-labels">
              <span>0</span>
              <span>13.5 单位</span>
            </div>
          </div>
          <div class="warning" id="threeDayWarning" style="display:none;">
            <span>⚠️</span>
            <span id="threeDayWarningText"></span>
          </div>
        </section>
      </div>

      <aside class="form-card">
        <div class="section-head">
          <h2>快速添加</h2>
        </div>
        <form id="drinkForm">
          <div class="form-group">
            <label for="brandSelect">品牌</label>
            <input type="text" id="brandSelect" list="brandList" placeholder="选择或输入品牌">
            <datalist id="brandList"></datalist>
          </div>
          <div class="form-group">
            <label for="alcohol">酒精度 (%)</label>
            <input type="number" id="alcohol" min="0" max="100" step="0.1" placeholder="例如 4.5 / 40 / 53" required>
          </div>
          <div class="form-group">
            <label for="volume">饮酒量</label>
            <div class="volume-row">
              <input type="number" id="volume" min="0" step="0.01" placeholder="例如 330 / 30 / 150" required>
              <select id="volumeUnit">
                <option value="ml" selected>毫升 (ml)</option>
                <option value="oz">盎司 (oz)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="drinkDate">日期</label>
            <input type="date" id="drinkDate" required>
          </div>
          <button type="submit" class="btn-submit">保存本条记录</button>
        </form>
      </aside>
    </section>

    <section class="history-card">
      <div class="history-headline">
        <div class="section-head">
          <h2>历史记录</h2>
        </div>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-message">暂无记录</p>
      </div>
    </section>
  </div>

  <script>
    const WEEKLY_LIMIT = 14;
    const DAILY_LIMIT = 4.5;
    const THREE_DAY_LIMIT = DAILY_LIMIT * 3;
    const ML_PER_OZ = 29.5735;
    const STORAGE_KEY_DRINKS = "alcohol_monitor_drinks_v2";
    const STORAGE_KEY_BRANDS = "alcohol_monitor_brands_v2";
    const SEEDED_BRANDS = [
      "茅台", "五粮液", "青岛啤酒", "雪花啤酒", "1664", "山崎12", "響", "Malibu", "朝日",
      "燕京纯生", "三得利金标啤酒", "Stella", "伏特加", "Gin", "鸡尾酒", "IPA", "巧克力世涛",
      "德式小麦", "古斯海盐", "燕京U8", "燕京白啤"
    ];
    const SEEDED_RECORDS = [];

    const form = document.getElementById("drinkForm");
    const brandInput = document.getElementById("brandSelect");
    const brandList = document.getElementById("brandList");
    const alcoholInput = document.getElementById("alcohol");
    const volumeInput = document.getElementById("volume");
    const volumeUnit = document.getElementById("volumeUnit");
    const dateInput = document.getElementById("drinkDate");
    const pureAlcoholEl = document.getElementById("pureAlcohol");
    const alcoholUnitsEl = document.getElementById("alcoholUnits");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const warningEl = document.getElementById("warning");
    const warningText = document.getElementById("warningText");
    const dailyPureAlcoholEl = document.getElementById("dailyPureAlcohol");
    const dailyUnitsEl = document.getElementById("dailyUnits");
    const dailyProgressText = document.getElementById("dailyProgressText");
    const dailyProgressFill = document.getElementById("dailyProgressFill");
    const dailyWarningEl = document.getElementById("dailyWarning");
    const dailyWarningText = document.getElementById("dailyWarningText");
    const threeDayPureAlcoholEl = document.getElementById("threeDayPureAlcohol");
    const threeDayUnitsEl = document.getElementById("threeDayUnits");
    const threeDayProgressText = document.getElementById("threeDayProgressText");
    const threeDayProgressFill = document.getElementById("threeDayProgressFill");
    const threeDayWarningEl = document.getElementById("threeDayWarning");
    const threeDayWarningText = document.getElementById("threeDayWarningText");
    const historyList = document.getElementById("historyList");

    let lastKnownToday = getTodayDate();

    document.addEventListener("DOMContentLoaded", () => {
      initializeStorage();
      syncDateInputWithToday(true);
      renderBrandOptions();
      loadAndRender();
      window.setInterval(handleDateRollover, 60 * 1000);
    });

    function initializeStorage() {
      if (!localStorage.getItem(STORAGE_KEY_BRANDS)) {
        localStorage.setItem(STORAGE_KEY_BRANDS, JSON.stringify(SEEDED_BRANDS));
      }
      if (!localStorage.getItem(STORAGE_KEY_DRINKS)) {
        localStorage.setItem(STORAGE_KEY_DRINKS, JSON.stringify(SEEDED_RECORDS));
      }
    }

    function getTodayDate() {
      return formatLocalDate(new Date());
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function normalizeRecordDate(dateValue) {
      if (typeof dateValue !== "string") return null;

      const match = dateValue.trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:T.*)?$/);
      if (!match) return null;

      const [, yearText, monthText, dayText] = match;
      const year = Number(yearText);
      const month = Number(monthText);
      const day = Number(dayText);
      const date = new Date(year, month - 1, day);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
        return null;
      }
      return formatLocalDate(date);
    }

    function parseLocalDate(dateValue) {
      const normalizedDate = normalizeRecordDate(dateValue);
      if (!normalizedDate) return null;
      const [year, month, day] = normalizedDate.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function syncDateInputWithToday(force = false) {
      const today = getTodayDate();
      if (force || !dateInput.value || dateInput.value === lastKnownToday) {
        dateInput.value = today;
      }
      lastKnownToday = today;
    }

    function handleDateRollover() {
      const today = getTodayDate();
      if (today === lastKnownToday) return;
      syncDateInputWithToday();
      loadAndRender();
    }

    function isValidRecord(record) {
      return (
        Number.isFinite(Number(record?.alcohol)) &&
        Number(record.alcohol) >= 0 &&
        Number(record.alcohol) <= 100 &&
        Number.isFinite(Number(record?.volume)) &&
        Number(record.volume) > 0 &&
        (record?.unit === "ml" || record?.unit === "oz") &&
        Boolean(normalizeRecordDate(record?.date))
      );
    }

    function readBrands() {
      const brands = JSON.parse(localStorage.getItem(STORAGE_KEY_BRANDS) || "[]");
      return Array.from(new Set(brands.map(brand => String(brand).trim()).filter(Boolean)));
    }

    function writeBrands(brands) {
      localStorage.setItem(STORAGE_KEY_BRANDS, JSON.stringify(Array.from(new Set(brands))));
    }

    function readRecords() {
      const records = JSON.parse(localStorage.getItem(STORAGE_KEY_DRINKS) || "[]");
      if (!Array.isArray(records)) return [];
      return records
        .filter(isValidRecord)
        .map(record => ({ ...record, date: normalizeRecordDate(record.date) }));
    }

    function writeRecords(records) {
      const normalizedRecords = records
        .filter(isValidRecord)
        .map(record => ({ ...record, date: normalizeRecordDate(record.date) }));
      localStorage.setItem(STORAGE_KEY_DRINKS, JSON.stringify(normalizedRecords));
    }

    function renderBrandOptions() {
      brandList.innerHTML = "";
      readBrands().forEach(brand => {
        const option = document.createElement("option");
        option.value = brand;
        brandList.appendChild(option);
      });
    }

    function loadAndRender() {
      const records = readRecords();
      renderStats(records);
      renderHistory(records);
    }

    function getWeekRange() {
      const now = new Date();
      const end = new Date(now);
      end.setHours(23, 59, 59, 999);
      const start = new Date(now);
      start.setDate(now.getDate() - 6);
      start.setHours(0, 0, 0, 0);
      return { start, end };
    }

    function getRecentDayRange(dayCount) {
      const now = new Date();
      const end = new Date(now);
      end.setHours(23, 59, 59, 999);
      const start = new Date(now);
      start.setDate(now.getDate() - (dayCount - 1));
      start.setHours(0, 0, 0, 0);
      return { start, end };
    }

    function isRecordInRange(record, range) {
      const recordDate = parseLocalDate(record.date);
      if (!recordDate) return false;
      recordDate.setHours(12, 0, 0, 0);
      return recordDate >= range.start && recordDate <= range.end;
    }

    function calcPureAlcohol(volume, unit, alcohol) {
      const volumeInMl = unit === "oz" ? volume * ML_PER_OZ : volume;
      return volumeInMl * (alcohol / 100);
    }

    function updateStatCard(records, config) {
      let totalPureAlcohol = 0;
      records.forEach(record => {
        totalPureAlcohol += calcPureAlcohol(Number(record.volume), record.unit, Number(record.alcohol));
      });

      const units = totalPureAlcohol / 10;
      config.pureAlcoholEl.textContent = Math.round(totalPureAlcohol);
      config.unitsEl.textContent = units.toFixed(1);
      config.progressFill.style.width = `${Math.min((units / config.limit) * 100, 100)}%`;
      config.progressText.textContent = `${units.toFixed(1)} / ${config.limit} 单位`;

      config.progressFill.classList.remove("warning", "danger");
      config.warningEl.classList.remove("normal", "caution", "danger");
      config.warningEl.style.display = "none";

      if (units > config.limit) {
        config.progressFill.classList.add("danger");
        config.warningEl.classList.add("danger");
        config.warningEl.style.display = "flex";
        config.warningText.textContent = config.dangerMsg;
      } else if (units >= config.cautionThreshold) {
        config.progressFill.classList.add("warning");
        config.warningEl.classList.add("caution");
        config.warningEl.style.display = "flex";
        config.warningText.textContent = config.cautionMsg;
      } else {
        config.warningEl.classList.add("normal");
      }
    }

    function renderStats(records) {
      const weekRange = getWeekRange();
      const todayRange = getRecentDayRange(1);
      const threeDayRange = getRecentDayRange(3);
      const weekRecords = records.filter(record => isRecordInRange(record, weekRange));
      const todayRecords = records.filter(record => isRecordInRange(record, todayRange));
      const threeDayRecords = records.filter(record => isRecordInRange(record, threeDayRange));

      updateStatCard(weekRecords, {
        pureAlcoholEl,
        unitsEl: alcoholUnitsEl,
        progressFill,
        progressText,
        warningEl,
        warningText,
        limit: WEEKLY_LIMIT,
        cautionThreshold: 10,
        dangerMsg: "已超过每周 14 单位限值，请注意健康饮酒。",
        cautionMsg: "已接近每周 14 单位限值，请注意控制饮酒量。"
      });

      updateStatCard(todayRecords, {
        pureAlcoholEl: dailyPureAlcoholEl,
        unitsEl: dailyUnitsEl,
        progressFill: dailyProgressFill,
        progressText: dailyProgressText,
        warningEl: dailyWarningEl,
        warningText: dailyWarningText,
        limit: DAILY_LIMIT,
        cautionThreshold: 3.5,
        dangerMsg: "已超过今日 4.5 单位限值。",
        cautionMsg: "已接近今日 4.5 单位限值，请注意控制。"
      });

      updateStatCard(threeDayRecords, {
        pureAlcoholEl: threeDayPureAlcoholEl,
        unitsEl: threeDayUnitsEl,
        progressFill: threeDayProgressFill,
        progressText: threeDayProgressText,
        warningEl: threeDayWarningEl,
        warningText: threeDayWarningText,
        limit: THREE_DAY_LIMIT,
        cautionThreshold: 10.5,
        dangerMsg: "近三日已超过 13.5 单位参考限值。",
        cautionMsg: "近三日已接近 13.5 单位参考限值，请注意节奏。"
      });
    }

    function renderHistory(records) {
      if (!records.length) {
        historyList.innerHTML = '<p class="empty-message">暂无记录</p>';
        return;
      }

      historyList.innerHTML = "";
      [...records]
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
        .forEach(record => {
          const units = calcPureAlcohol(Number(record.volume), record.unit, Number(record.alcohol)) / 10;
          const item = document.createElement("div");
          item.className = "history-item";

          const info = document.createElement("div");
          info.className = "history-info";

          const brand = document.createElement("div");
          brand.className = "history-brand";
          brand.textContent = record.brand || "未知品牌";

          const details = document.createElement("div");
          details.className = "history-details";
          details.textContent = `酒精度: ${record.alcohol}% | ${record.volume}${record.unit} | ${units.toFixed(1)} 单位`;

          const date = document.createElement("div");
          date.className = "history-date";
          date.textContent = record.date;

          const actions = document.createElement("div");
          actions.className = "history-actions";

          const repeatButton = document.createElement("button");
          repeatButton.className = "btn-repeat";
          repeatButton.dataset.action = "repeat";
          repeatButton.dataset.id = record.id;
          repeatButton.textContent = "又喝了一份";

          const button = document.createElement("button");
          button.className = "btn-delete";
          button.dataset.action = "delete";
          button.dataset.id = record.id;
          button.textContent = "删除";

          actions.append(repeatButton, button);
          info.append(brand, details, date);
          item.append(info, actions);
          historyList.appendChild(item);
        });
    }

    function fillFormFromRecord(record) {
      brandInput.value = record.brand || "";
      alcoholInput.value = record.alcohol;
      volumeInput.value = record.volume;
      volumeUnit.value = record.unit;
      dateInput.focus();
      dateInput.showPicker?.();
      form.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    historyList.addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      const records = readRecords();
      const record = records.find(item => item.id === button.dataset.id);
      if (!record) return;

      if (button.dataset.action === "repeat") {
        fillFormFromRecord(record);
        return;
      }

      if (button.dataset.action === "delete") {
        writeRecords(records.filter(item => item.id !== button.dataset.id));
        loadAndRender();
      }
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      syncDateInputWithToday();

      const brand = brandInput.value.trim();
      const alcohol = parseFloat(alcoholInput.value);
      const volume = parseFloat(volumeInput.value);
      const unit = volumeUnit.value;
      const date = dateInput.value;

      if (
        !Number.isFinite(alcohol) ||
        alcohol < 0 ||
        alcohol > 100 ||
        !Number.isFinite(volume) ||
        volume <= 0 ||
        (unit !== "ml" && unit !== "oz") ||
        !parseLocalDate(date)
      ) {
        alert("请填写合法的酒精度、饮酒量和日期");
        return;
      }

      const records = readRecords();
      records.push({
        id: crypto.randomUUID(),
        brand,
        alcohol,
        volume,
        unit,
        date,
        timestamp: Date.now()
      });
      writeRecords(records);

      if (brand) {
        const brands = readBrands();
        if (!brands.includes(brand)) {
          brands.push(brand);
          writeBrands(brands);
          renderBrandOptions();
        }
      }

      loadAndRender();
      form.reset();
      syncDateInputWithToday(true);
    });
  </script>
</body>
</html>
